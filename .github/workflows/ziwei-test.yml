name: Ziwei test-mode checks

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ziwei-test.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/public-smoke.yml'
      - '.github/workflows/production-preflight.yml'
      - 'scripts/**'
      - 'compose.paid-local.yml'
      - 'infra/paid-local/**'
      - '.gitignore'
  push:
    branches: [main, integration/ziwei-stripe-test]

permissions:
  contents: read

jobs:
  backend:
    strategy:
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: ziwei_qa
          POSTGRES_DB: ziwei_qa
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ziwei_qa -d ziwei_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'sqlite://'
      STRIPE_TEST_ENABLED: 'false'
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ''
      MINIMAX_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Public smoke regressions (mocked HTTPS)
        run: python -m unittest discover -s backend/tests -p test_public_smoke.py -v
      - name: Release CI gate regressions (mocked API)
        run: python -m unittest discover -s backend/tests -p test_release_gate.py -v
      - name: Deployment safety regressions (isolated fixtures)
        run: python -m unittest discover -s backend/tests -p test_deploy_safety.py -v
      - name: Read-only production preflight regressions (mocked)
        run: python -m unittest discover -s backend/tests -p test_production_preflight.py -v
      - name: SSH host observation regressions (mocked network)
        run: python -m unittest discover -s backend/tests -p test_ssh_host_observation.py -v
      - name: Code-only rollback regressions (mocked commands)
        run: python -m unittest discover -s backend/tests -p test_release_image_state.py -v
      - name: Isolated Docker code-rollback rehearsal
        if: ${{ matrix.python == '3.11' }}
        timeout-minutes: 5
        env:
          RUN_CODE_ROLLBACK_DOCKER_TEST: '1'
        run: python -m unittest discover -s backend/tests -p test_release_image_docker.py -v
      - name: Release workflow integration regressions (no production)
        run: python -m unittest discover -s backend/tests -p test_release_workflow_integration.py -v
      - name: SQLite payment and reading regressions
        run: >-
          python -m pytest backend/tests/acceptance backend/tests/test_billing_stripe.py
          backend/tests/test_credits.py backend/tests/test_ziwei_oracle_routes.py
          backend/tests/test_ziwei_stream.py backend/tests/test_qian_routes.py
          backend/tests/test_paid_product.py backend/tests/test_paid_accounts.py backend/tests/test_paid_email.py backend/tests/test_paid_email_routes.py backend/tests/test_paid_retention.py backend/tests/test_paid_order_history.py backend/tests/test_paid_billing_audit.py backend/tests/test_paid_webhook_reliability.py backend/tests/test_qian_stream_reliability.py backend/tests/test_oracle_provider_timeouts.py backend/tests/test_paid_qian_history.py -q --tb=short
      - name: PostgreSQL acceptance and concurrency
        env:
          ZIWEI_QA_POSTGRES_URL: postgresql+psycopg://ziwei_qa@127.0.0.1:55432/ziwei_qa
        run: python -m pytest backend/tests/acceptance backend/tests/test_paid_accounts.py backend/tests/test_paid_retention.py backend/tests/test_paid_order_history.py backend/tests/test_paid_billing_audit.py backend/tests/test_paid_webhook_reliability.py backend/tests/test_qian_stream_reliability.py backend/tests/test_oracle_provider_timeouts.py backend/tests/test_paid_qian_history.py -q --tb=short
  frontend:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node scripts/ziwei-billing-test.cjs
      - run: node scripts/paid-product-test.cjs
      - run: node scripts/paid-account-test.cjs
      - run: node scripts/qian-stream-test.cjs
      - run: node scripts/qian-history-test.cjs
      - run: node scripts/narration-reliability-test.cjs
      - run: npx tsc --noEmit
  paid-product-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_PRODUCT_MODE: paid
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      SITE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.65.0
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - run: npm run build
      - name: Real browser-to-backend account integration (local HTTP, disposable SQLite)
        run: bash ../scripts/test-paid-browser-integration.sh
      - name: Local paid product browser checks (mocked API)
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3001 > /tmp/paid-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/paid-product-browser-test.cjs
          node scripts/paid-account-browser-test.cjs
          node scripts/paid-discovery-browser-test.cjs
          node scripts/paid-credits-browser-test.cjs
          node scripts/qian-workspace-browser-test.cjs
          node scripts/paid-qian-history-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paid-product-ui
          path: |
            /tmp/paid-home-*.png
            /tmp/paid-discovery-*.png
            /tmp/paid-disabled-*.png
            /tmp/paid-credits-*.png
            /tmp/paid-qian-history-*.png
            /tmp/paid-preview.log
            /tmp/paid-integration-api.log
            /tmp/paid-integration-web.log
            /tmp/paid-integration-proxy.log
  paid-local-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4 PyYAML==6.0.2
      - name: Read-only preview checker tests
        run: python -m pytest backend/tests/test_paid_preview_check.py backend/tests/test_paid_local_packaging.py -q
      - name: Validate isolated Compose configuration
        run: docker compose -f compose.paid-local.yml config --quiet
      - name: Build and check disposable local package
        run: |
          set -euo pipefail
          # Unique project, no production context/env files, no credentials or emails.
          export COMPOSE_PROJECT_NAME="paid-qa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker compose -f compose.paid-local.yml logs --no-color > /tmp/paid-package.log 2>&1 || true
            docker compose -f compose.paid-local.yml down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose -f compose.paid-local.yml build
          docker compose -f compose.paid-local.yml up -d --wait --wait-timeout 120
          for attempt in $(seq 1 30); do
            if python scripts/check-paid-preview.py > /tmp/paid-package-check.json; then break; fi
            sleep 2
          done
          python scripts/check-paid-preview.py
          # Count expired auth material only; never apply cleanup in this smoke job.
          docker compose -f compose.paid-local.yml exec -T backend python -m app.cli.paid_retention
          docker compose -f compose.paid-local.yml exec -T backend python -m app.cli.paid_billing_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paid-local-package
          path: |
            /tmp/paid-package.log
            /tmp/paid-package-check.json
